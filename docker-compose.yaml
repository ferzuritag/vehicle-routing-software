services:
  api-users:
    build: ./vrs-users
    ports:
      - 8000:80
    environment:
      - AUTH_API_PATH=${AUTH_API_PATH}
      - USERS_API_PATH=${USERS_API_PATH}
      - USERS_API_KEY=${USERS_API_KEY}
      - AUTH_API_KEY=${AUTH_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_SERVER_PORT=${SMTP_SERVER_PORT}
      - SMTP_SERVER_USER=${SMTP_SERVER_USER}
      - SMTP_SERVER_PASSWORD=${SMTP_SERVER_PASSWORD}
      - MONGO_CONNECTION_STRING=${USERS_MONGO_CONNECTION_STRING}
    depends_on:
      - users-db
    deploy:
      resources:
        limits:
          cpus: "1"     # máximo 1.5 CPUs
          memory: 128M    # máximo 256 MB de RAM

  users-db:
    image: mongo:7.0
    ports:
      - 27017:27017
    deploy:
      resources:
        limits:
          cpus: "1"     # máximo 1.5 CPUs
          memory: 128M    # máximo 256 MB de RAM

  api-auth:
    build: ./vrs-auth
    ports:
      - 8001:80
    environment:
      - USERS_API_PATH=${USERS_API_PATH}
      - USERS_API_KEY=${USERS_API_KEY}
      - AUTH_API_KEY=${AUTH_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_CONNECTION_STRING=${AUTH_REDIS_CONNECTION_STRING}
    depends_on:
      - auth-db
    deploy:
      resources:
        limits:
          cpus: "2"     # máximo 1.5 CPUs
          memory: 128M    # máximo 256 MB de RAM

  auth-db:
    image: redis:7.2.4
    ports:
      - 6379:6379
    deploy:
      resources:
        limits:
          cpus: "2"     # máximo 1.5 CPUs
          memory: 128M    # máximo 256 MB de RAM

  api-routing-problems:
    build: ./vrs-routing-problems
    ports:
      - 8002:80
    environment:
      - AUTH_API_PATH=${AUTH_API_PATH}
      - AUTH_API_KEY=${AUTH_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MONGO_CONNECTION_STRING=${ROUTING_PROBLEMS_MONGO_CONNECTION_STRING}
      - ROUTING_PROBLEMS_SOLVER_ENDPOINTS=${ROUTING_PROBLEMS_SOLVER_ENDPOINTS}
    depends_on:
      - routing-problems-db
    deploy:
      resources:
        limits:
          cpus: "1"     # máximo 1.5 CPUs
          memory: 128M    # máximo 256 MB de RAM

  routing-problems-db:
    image: mongo:7.0
    ports:
      - 27018:27017
    deploy:
      resources:
        limits:
          cpus: "1"     # máximo 1.5 CPUs
          memory: 128M    # máximo 256 MB de RAM

  vrp-solver:
    build: ./vrs-vrp
    environment:
      - OPEN_ROUTE_BASE_URL=${OPEN_ROUTE_BASE_URL}
      - OPEN_ROUTE_API_KEY=${OPEN_ROUTE_API_KEY}
    ports:
      - 8003:80
    deploy:
      resources:
        limits:
          cpus: "3"     # máximo 1.5 CPUs
          memory: 128M    # máximo 256 MB de RAM

  cvrp-solver:
    build: ./vrs-cvrp
    environment:
      - OPEN_ROUTE_BASE_URL=${OPEN_ROUTE_BASE_URL}
      - OPEN_ROUTE_API_KEY=${OPEN_ROUTE_API_KEY}
    ports:
      - 8004:80
    deploy:
      resources:
        limits:
          cpus: "1"     # máximo 1.5 CPUs
          memory: 128M    # máximo 256 MB de RAM

  vrptw-solver:
    build: ./vrs-vrptw
    environment:
      - OPEN_ROUTE_BASE_URL=${OPEN_ROUTE_BASE_URL}
      - OPEN_ROUTE_API_KEY=${OPEN_ROUTE_API_KEY}
    ports:
      - 8005:80
    deploy:
      resources:
        limits:
          cpus: "1"     # máximo 1.5 CPUs
          memory: 128M    # máximo 256 MB de RAM
  ui-app:
    build: 
      context: ./vrs-ui
      args:
        - OPEN_ROUTE_BASE_URL=${OPEN_ROUTE_BASE_URL}
        - OPEN_ROUTE_API_KEY=${OPEN_ROUTE_API_KEY}
        - AUTH_API_PATH=${AUTH_API_PATH}
        - ROUTING_PROBLEMS_API_PATH=${ROUTING_PROBLEMS_API_PATH}
        - USERS_API_PATH=${USERS_API_PATH}
    ports:
      - 80:80
    # environment:
    #   - OPEN_ROUTE_BASE_URL=${OPEN_ROUTE_BASE_URL}
    #   - OPEN_ROUTE_API_KEY=${OPEN_ROUTE_API_KEY}
    #   - AUTH_API_PATH=${AUTH_API_PATH}
    #   - ROUTING_PROBLEMS_API_PATH=${ROUTING_PROBLEMS_API_PATH}
    #   - USERS_API_PATH=${USERS_API_PATH}
    deploy:
      resources:
        limits:
          cpus: "1"     # máximo 1.5 CPUs
          memory: 126M    # máximo 256 MB de RAM
    
