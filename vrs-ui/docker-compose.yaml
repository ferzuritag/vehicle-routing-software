services:
  ui-app:
    build: .
    ports:
      - 80:80
    environment:
      - VITE_OPEN_ROUTE_BASE_URL=${OPEN_ROUTE_BASE_URL}
      - VITE_OPEN_ROUTE_API_KEY=${OPEN_ROUTE_API_KEY}
      - VITE_USERS_API_PATH=${USERS_API_PATH}
      - VITE_AUTH_API_PATH=${AUTH_API_PATH}
      - VITE_ROUTING_PROBLEMS_API_PATH=${ROUTING_PROBLEMS_API_PATH}